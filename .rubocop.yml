AllCops:
  NewCops: disable

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/MethodLength:
  Max: 25

Metrics/ClassLength:
  Max: 200

Metrics/AbcSize:
  Max: 30

Style/Documentation:
  Enabled: false

Style/SafeNavigation:
  Enabled: false

Style/MutableConstant:
  Enabled: false

Metrics/BlockLength:
  Max: 40

Layout/EndOfLine:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false
